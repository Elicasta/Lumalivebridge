name: desktop-build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/unified-luma-live
    paths:
      - "src-tauri/**"
      - "app/**"
      - "remote/**"
      - "package.json"
      - ".github/workflows/desktop-build.yml"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install

      - name: Build app bundle
        run: npm run desktop:build -- --bundles app

      - name: Re-sign for macOS 26 compatibility
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Luma Live.app"
          BIN="$APP/Contents/MacOS/luma-live"

          test -d "$APP"
          test -x "$BIN"

          # macOS 26.5+ can reject ad-hoc signatures that use the default
          # 16 KiB code-signing page size. Force 4 KiB pages.
          codesign --force --sign - --timestamp=none --pagesize=4096 "$BIN"
          codesign --force --deep --sign - --timestamp=none --pagesize=4096 "$APP"

          codesign --verify --deep --strict --verbose=4 "$APP"
          codesign -d --verbose=4 "$BIN" 2>&1 | tee /tmp/luma-codesign.txt
          grep -Eiq "page size[=: ]+4096|pagesize[=: ]+4096" /tmp/luma-codesign.txt

      - name: Launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          BIN="src-tauri/target/release/bundle/macos/Luma Live.app/Contents/MacOS/luma-live"
          LOG="/tmp/luma-live-smoke.log"

          "$BIN" >"$LOG" 2>&1 &
          PID=$!

          sleep 6

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "Luma Live exited during startup smoke test."
            cat "$LOG" || true
            exit 1
          fi

          kill "$PID" || true
          wait "$PID" || true
          echo "Luma Live remained alive through the startup smoke test."
          cat "$LOG" || true

      - name: Create signed DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Luma Live.app"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          DMG="$DMG_DIR/Luma-Live-0.4.0-aarch64.dmg"
          STAGE="$(mktemp -d)"

          mkdir -p "$DMG_DIR"
          cp -R "$APP" "$STAGE/Luma Live.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create             -volname "Luma Live"             -srcfolder "$STAGE"             -ov             -format UDZO             "$DMG"

          rm -rf "$STAGE"
          test -f "$DMG"

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Live-macOS-v0.4.0
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
